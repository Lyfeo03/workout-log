<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#22c55e" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="运动打卡" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>运动打卡 · 有氧 / 无氧</title>
<style>
  :root{--primary:#22c55e;--primary-dark:#16a34a;--text:#111827;--sub:#6b7280;--line:#e5e7eb;--bg:#f5f7fa;--purple:#8b5cf6;--blue:#0ea5e9}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%;height:100%}
  input,button,textarea{font-family:inherit;font-size:16px}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif}
  .app{width:100%;max-width:100%;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom));min-height:100vh;overflow-x:hidden}
  @media (min-width:560px){ .app{max-width:480px} }
  .card{background:#fff;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(17,24,39,.05)}
  .row{display:flex;align-items:center;justify-content:space-between}
  .title{font-size:17px;font-weight:600}
  .sub{font-size:12px;color:var(--sub)}
  .hero{background:linear-gradient(135deg,#22c55e,#0ea5e9);border-radius:24px;padding:22px;color:#fff;margin-bottom:14px}
  .hero h1{margin:6px 0 0;font-size:24px}
  .badge{background:rgba(255,255,255,.22);border-radius:999px;padding:6px 14px;font-size:14px}
  .bar{height:6px;background:rgba(255,255,255,.28);border-radius:999px;overflow:hidden;margin-top:14px}
  .bar>i{display:block;height:100%;background:#fff;border-radius:999px;transition:width .3s}
  .week{display:flex;justify-content:space-between;margin-top:14px}
  .wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;opacity:.85}
  .dot{width:16px;height:16px;border-radius:6px;background:rgba(255,255,255,.3)}
  .dot.on{background:#fff}
  .dot.today{outline:2px solid rgba(255,255,255,.6)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer;color:#374151}
  .chip.active{font-weight:600}
  .dur{display:flex;align-items:center;gap:10px;margin-top:10px}
  .step{width:52px;height:52px;border-radius:50%;border:none;background:#f3f4f6;font-size:16px;font-weight:700;cursor:pointer;color:#374151;flex:none;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  .step:active{background:#e5e7eb;transform:scale(.95)}
  .dur input{flex:1;text-align:center;font-size:34px;font-weight:700;border:none;border-bottom:2px solid var(--line);background:transparent;outline:none;color:var(--text)}
  .segs{display:flex;gap:8px;margin-top:8px}
  .seg{flex:1;text-align:center;padding:9px 0;border-radius:11px;background:#f3f4f6;font-size:13px;cursor:pointer;border:none}
  .seg.on{background:#dcfce7;color:#15803d;font-weight:600}
  input.txt,textarea{width:100%;background:#f9fafb;border:1px solid transparent;border-radius:11px;padding:11px;font-size:14px;font-family:inherit;outline:none}
  input.txt:focus,textarea:focus{border-color:var(--primary)}
  textarea{height:64px;resize:none}
  .btn{width:100%;border:none;border-radius:999px;background:var(--primary);color:#fff;font-size:16px;font-weight:600;padding:14px;cursor:pointer}
  .tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;width:100%;max-width:100%;margin:0 auto;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
  @media (min-width:560px){ .tabs{max-width:480px} }
  .tabs button{flex:1;border:none;background:none;padding:8px 0 10px;font-size:11px;color:var(--sub);cursor:pointer;min-height:52px}
  .tabs button span{display:block;font-size:19px}
  .tabs button.on{color:var(--primary-dark);font-weight:600}
  .sum{display:flex;margin-top:12px}
  .sum>div{flex:1;text-align:center}
  .sum b{display:block;font-size:22px}
  .who{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #f3f4f6;cursor:pointer}
  .who:last-child{border-bottom:none}
  .wicon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px}
  .kind{font-size:10px;border-radius:5px;padding:1px 6px;margin-left:6px;font-weight:400}
  .kind.cardio{background:#e0f2fe;color:#0369a1}
  .kind.strength{background:#ede9fe;color:#6d28d9}
  .addrow{display:flex;gap:12px}
  .addcard{flex:1;background:#fff;border-radius:20px;padding:16px;cursor:pointer;box-shadow:0 2px 10px rgba(17,24,39,.05)}
  .addcard.c{border-top:5px solid var(--primary)}
  .addcard.s{border-top:5px solid var(--purple)}
  .excard{background:#fff;border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(17,24,39,.05)}
  .setrow{display:flex;align-items:center;gap:6px;padding:5px 0}
  .setrow.warm{background:#fffbeb;border-radius:8px}
  .nud{width:38px;height:38px;border-radius:50%;background:#f3f4f6;border:none;font-size:18px;font-weight:600;cursor:pointer;color:#374151;flex:none;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  .nud:active{background:#d1d5db}
  .nin{width:62px;height:38px;text-align:center;border:none;border-bottom:1.5px solid var(--line);font-size:17px;font-weight:600;outline:none;background:transparent;-moz-appearance:textfield}
  .nin::-webkit-outer-spin-button,.nin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .setidx{width:34px;font-size:12px;color:#6b7280;text-align:center;cursor:pointer}
  .addset{text-align:center;margin-top:8px;padding:9px;border-radius:11px;background:#f0fdf4;color:#15803d;font-size:13px;font-weight:600;cursor:pointer}
  .rest{display:flex;align-items:center;justify-content:space-between;background:#1f2937;color:#fff;border-radius:16px;padding:14px 16px;margin-bottom:12px}
  .rest b{font-size:28px;display:block;line-height:1}
  .rbtn{background:var(--primary);color:#fff;border-radius:999px;padding:7px 14px;font-size:13px;border:none;cursor:pointer}
  .rbtn.gh{background:rgba(255,255,255,.15)}
  .mask{position:fixed;inset:0;background:rgba(17,24,39,.4);z-index:10}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;height:75vh;background:#fff;border-radius:22px 22px 0 0;z-index:11;display:flex;flex-direction:column;padding:16px}
  .liblist{flex:1;overflow:auto;margin-top:10px}
  .libitem{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #f3f4f6;cursor:pointer}
  .kal{font-weight:700;color:var(--primary-dark);font-size:13px}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:rgba(17,24,39,.88);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
  .cell{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;cursor:pointer;color:#374151}
  .cell.hit{background:#f0fdf4;color:#15803d;font-weight:600}
  .cell.today{box-shadow:inset 0 0 0 2px var(--primary)}
  .cell.future{color:#d1d5db;cursor:default}
  .dots{display:flex;gap:3px;margin-top:2px}
  .d{width:5px;height:5px;border-radius:50%}
  .d.c{background:var(--blue)} .d.s{background:var(--purple)}
  .exlines{padding-left:46px;margin-top:6px}
  .exline{display:flex;justify-content:space-between;font-size:11px;color:#6b7280;padding:2px 0}

  /* ---------- 训练模板 ---------- */
  .tpl-card{background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 10px rgba(17,24,39,.05);display:flex;align-items:center;gap:12px}
  .tpl-ico{width:40px;height:40px;border-radius:12px;background:#ede9fe;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
  .tpl-name{font-weight:600;font-size:15px}
  .tpl-use{border:none;border-radius:999px;background:var(--purple);color:#fff;font-size:13px;font-weight:600;padding:8px 16px;cursor:pointer;flex:none}
  .tpl-use:active{opacity:.8}
  .tpl-del{border:none;background:none;color:#d1d5db;font-size:18px;cursor:pointer;padding:4px 6px}
  .ghost-btn{width:100%;border:2px dashed #cbd5e1;background:none;border-radius:16px;padding:13px;color:#64748b;font-size:14px;cursor:pointer;margin-bottom:10px}
  .save-tpl{width:100%;border:none;border-radius:14px;background:#f5f3ff;color:#6d28d9;font-size:14px;font-weight:600;padding:12px;cursor:pointer;margin-top:10px}

  /* ---------- 设置页 ---------- */
  .setrow2{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:13px 0;border-bottom:1px solid #f3f4f6}
  .setrow2 > span:last-child{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px}
  .setrow2:last-child{border-bottom:none}
  .setrow2 input[type=number]{width:72px;text-align:right;border:none;border-bottom:1.5px solid var(--line);font-size:15px;outline:none;background:transparent}
  .danger-btn{width:100%;border:1px solid #fecaca;background:#fef2f2;color:#dc2626;border-radius:14px;padding:12px;font-size:14px;cursor:pointer;margin-top:12px}
  .ok-btn{width:100%;border:none;background:var(--primary);color:#fff;border-radius:14px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;margin-top:12px}
  .pill{display:inline-block;font-size:11px;background:#f3f4f6;color:#6b7280;border-radius:999px;padding:2px 9px;margin-left:6px}

  /* ---------- 空态 ---------- */
  .big-empty{text-align:center;padding:26px 10px}
  .big-empty .ico{font-size:40px}
  .big-empty .t{font-size:15px;font-weight:600;margin-top:8px}
  .big-empty .d{font-size:12px;color:var(--sub);margin-top:4px}

  /* ---------- 固定底部操作条 ---------- */
  .actionbar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:rgba(255,255,255,.97);backdrop-filter:blur(8px);
    border-top:1px solid var(--line);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    display:flex;gap:10px;max-width:100%;margin:0 auto;
  }
  @media (min-width:560px){ .actionbar{max-width:480px} }
  .actionbar .ab-main{
    flex:1;border:none;border-radius:14px;background:var(--primary);color:#fff;
    font-size:16px;font-weight:700;padding:14px;cursor:pointer;min-height:50px;
  }
  .actionbar .ab-main:active{background:var(--primary-dark)}
  .actionbar .ab-del{
    width:56px;border-radius:14px;border:1px solid #fecaca;background:#fef2f2;color:#dc2626;
    font-size:20px;cursor:pointer;min-height:50px;display:flex;align-items:center;justify-content:center;
  }
  .actionbar .ab-del:active{background:#fee2e2}
  
  /* 保存成功态 */
  .saved-flash{animation:flash .9s ease}
  @keyframes flash{0%{transform:scale(1)}30%{transform:scale(1.03)}100%{transform:scale(1)}}
  .toast{bottom:calc(150px + env(safe-area-inset-bottom)) !important;font-size:14px !important;padding:12px 20px !important}
  /* 首页卡片更紧凑 */
  @media (max-width:430px){
    .hero h1{font-size:22px !important}
    .hero{padding:18px !important}
    .addrow{gap:10px !important}
    .addcard{padding:14px !important}
    .card{padding:15px !important;border-radius:18px !important}
  }

  /* ---------- 首页 v2 ---------- */
  .hero{padding:18px 18px 16px}
  .hero-date{font-size:12px;opacity:.85}
  .hero h1{margin:5px 0 0;font-size:22px;line-height:1.25}
  .badge{font-size:13px;padding:5px 12px;white-space:nowrap}
  .hero-week{font-size:11px;opacity:.85;margin-top:6px}
  .week{margin-top:10px}
  .wd{gap:3px;font-size:10px}
  .dot{width:15px;height:15px;border-radius:5px}
  .sec-title{font-size:15px;font-weight:600}
  .sum>div b{font-size:20px}
  .addrow{gap:10px;margin-top:2px}
  .addcard{display:flex;flex-direction:column;align-items:flex-start;border:none;text-align:left;
    background:#fff;border-radius:18px;padding:14px;cursor:pointer;box-shadow:0 2px 10px rgba(17,24,39,.05);min-height:96px}
  .addcard:active{transform:scale(.98)}
  .addcard.c{border-top:4px solid var(--primary)}
  .addcard.s{border-top:4px solid var(--purple)}
  .ac-ico{font-size:24px;line-height:1}
  .addcard b{font-size:16px;margin-top:6px}
  .addcard small{font-size:11px;color:var(--sub);margin-top:2px}

  /* 首页记录行 */
  .rec-row{display:flex;align-items:center;gap:6px;border-bottom:1px solid #f1f5f9;padding:4px 0}
  .rec-row:last-child{border-bottom:none}
  .rec-main{display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:10px 2px;cursor:pointer;border-radius:10px}
  .rec-main:active{background:#f8fafc}
  .rec-main.rec-col{flex-direction:column;align-items:stretch;gap:0}
  .rec-info{flex:1;min-width:0;padding-left:2px}
  .rec-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px;line-height:1.4}
  .rec-main{gap:14px}
  .rec-val{font-weight:700;color:var(--primary-dark);font-size:15px;white-space:nowrap}
  .rec-unit{font-size:11px;font-weight:400;color:var(--sub)}
  .rec-del{border:1px solid #fee2e2;background:#fef2f2;color:#ef4444;width:40px;height:40px;border-radius:12px;
    font-size:17px;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}
  .rec-del:active{background:#fee2e2;color:#dc2626}
  .exlines{padding-left:0;margin-top:6px}
  .exline{font-size:12px;padding:3px 0}
  .ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tpl-block{margin-top:2px}
  .foot-note{text-align:center;font-size:11px;color:var(--sub);margin-top:16px;line-height:1.6}

  /* 录入页：隐藏底部导航，避免与保存条重叠 */
  body.has-bar #tabs{display:none !important}
  
  /* 时长行：确保 +5 不被挤出屏幕 */
  .dur{display:flex;align-items:center;gap:8px;margin-top:10px}
  .dur > div{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:center;gap:5px}
  .dur input{width:80px !important;max-width:80px}
  /* 分段按钮在窄屏下也放得下 */
  .segs{gap:8px}
  .seg{font-size:13px;padding:10px 0;min-width:0}
  /* 运动类型胶囊允许换行且不溢出 */
  .chips{gap:8px}
  .chip{font-size:13px;padding:7px 12px;white-space:nowrap}

  body.has-bar .app{padding-bottom:calc(110px + env(safe-area-inset-bottom)) !important}

  .hero{overflow:hidden}
  .week{display:flex;justify-content:space-between;gap:2px}
  .wd{flex:1;min-width:0}
  .sum>div{min-width:0}
  .sum>div b{display:block}
  .sum>div .sub{display:block;font-size:11px;white-space:nowrap}
  .card{overflow:hidden}
  .rec-title{min-width:0}
  .rec-main{min-width:0}

  .wd span{font-size:9px}
  .dot{width:14px;height:14px}
  .week{gap:0}
  .hero .row{gap:8px}

  /* ---------- 无氧 v2 ---------- */
  .ex-head{font-weight:700;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hist-line{font-size:12px;color:#0284c7;background:#f0f9ff;border-radius:8px;padding:6px 10px;margin-top:8px}
  .setrow{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid #f8fafc}
  .setrow:last-of-type{border-bottom:none}
  .setrow.warm{background:#fffbeb;border-radius:10px;padding-left:6px;padding-right:6px}
  .wt-group{display:flex;align-items:center;gap:4px;flex:1;min-width:0;justify-content:center}
  .times-sign{font-size:15px;color:#94a3b8;font-weight:600;flex:none;padding:0 1px}
  .unit{font-size:11px;color:#94a3b8;flex:none;width:16px}
  .row-x{width:26px;text-align:center;color:#d1d5db;font-size:15px;cursor:pointer;flex:none;padding:6px 0}
  .row-x:active{color:#ef4444}
  .add-ex-btn{width:100%;border:2px dashed #cbd5e1;background:none;border-radius:16px;
    padding:15px;color:#64748b;font-size:15px;cursor:pointer;margin-bottom:14px}
  .add-ex-btn:active{background:#f8fafc}
  .addset{margin-top:10px}
  .excard{padding:16px}

  .exlines .exline{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  .exline-n{color:#64748b;flex:none}
  .exline-v{color:#334155;font-variant-numeric:tabular-nums;text-align:right}

  .setrow{gap:2px}
  .nud{width:34px;height:34px;font-size:16px}
  .nin{width:56px;height:34px;font-size:16px}

  /* ---------- 页内确认条 ---------- */
  .cf-mask{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:999;
    display:flex;align-items:flex-end;justify-content:center;padding:0 0 env(safe-area-inset-bottom)}
  .cf-box{position:relative;z-index:1000;width:100%;max-width:480px;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(17,24,39,.18);
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));animation:cfUp .18s ease}
  @keyframes cfUp{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
  .cf-msg{font-size:16px;line-height:1.5;text-align:center;color:#111827;padding:6px 0 18px}
  .cf-actions{display:flex;gap:12px}
  .cf-actions button{flex:1;border:none;border-radius:14px;padding:15px;font-size:16px;
    font-weight:600;cursor:pointer;min-height:50px;touch-action:manipulation}
  .cf-cancel{background:#f1f5f9;color:#334155}
  .cf-cancel:active{background:#e2e8f0}
  .cf-ok{background:#ef4444;color:#fff}
  .cf-ok:active{background:#dc2626}

  /* ---------- 返回按钮 ---------- */
  .back-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:4px;
    min-width:88px;height:40px;padding:0 16px;
    border:none;border-radius:999px;background:#f1f5f9;color:#475569;
    font-size:15px;font-weight:500;cursor:pointer;flex:none;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  }
  .back-btn:active{background:#e2e8f0;color:#1e293b}
</style>
</head>
<body>
<div id="storageWarn" style="display:none;position:fixed;top:0;left:0;right:0;z-index:100;background:#fef3c7;color:#92400e;font-size:12px;padding:8px 12px;text-align:center;border-bottom:1px solid #fde68a">
  ⚠️ 当前环境无法保存数据（localStorage 被禁用），刷新后记录会丢失
</div>
<div class="app" id="app"></div>
<nav class="tabs" id="tabs">
  <button data-tab="home" class="on"><span>💪</span>今日</button>
  <button data-tab="stats"><span>📊</span>统计</button>
  <button data-tab="cal"><span>📅</span>日历</button>
  <button data-tab="me"><span>⚙️</span>我的</button>
</nav>
<div class="toast" id="toast"></div>

<script>

/* ================= 存储可用性检测 =================
   某些环境（沙箱 iframe / 内嵌 WebView）会禁用 localStorage，
   这里做内存兜底，页面照常可用，同时顶部给出警告。 */
const memStore = {};
let LS_OK = true;
try {
  localStorage.setItem('__t', '1'); localStorage.removeItem('__t');
} catch (e) { LS_OK = false; }
if (!LS_OK) {
  const raw = {
    getItem(k){ return Object.prototype.hasOwnProperty.call(memStore, k) ? memStore[k] : null; },
    setItem(k, v){ memStore[k] = String(v); },
    removeItem(k){ delete memStore[k]; },
    clear(){ Object.keys(memStore).forEach(k => delete memStore[k]); }
  };
  try { Object.defineProperty(window, 'localStorage', { value: raw, configurable: true }); } catch (e) {}
  document.addEventListener('DOMContentLoaded', () => {

/* ================= 页面内确认条（替代 window.confirm） =================
   原生 confirm 在快速连点时会出现多个系统弹窗叠层，误触容易“像关掉网页”。
   这里改为页内确认条：不阻塞、只允许一个、点击后立即移除。 */
/* 统一的删除按钮绑定：防连点、页内确认、删除后回首页 */
function bindDelete(btn, opts){
  if(!btn) return;
  btn.addEventListener('click', async function(ev){
    ev.preventDefault();
    ev.stopPropagation();
    if(btn.dataset.busy === '1') return;
    const id = opts.editing();
    if(!id){ toast('还没保存过，无需删除'); return; }
    btn.dataset.busy = '1';
    try {
      const ok = await uiConfirm(opts.confirmText || '确定删除？');
      if(!ok) return;
      opts.onDelete(id);
      state.editing = null;
      if(state.tab === 'strength') state.exs = [];
      document.body.classList.remove('has-bar');
      toast('已删除');
      goTab('home');
    } finally { delete btn.dataset.busy; }
  });
}

let pendingConfirm = null;   // {resolve}
function uiConfirm(msg){
  if(pendingConfirm) return Promise.resolve(false);   // 已有确认条在等，忽略新的
  return new Promise(function(resolve){
    pendingConfirm = { resolve };
    var wrap = document.createElement('div');
    wrap.className = 'cf-mask';
    wrap.innerHTML =
      '<div class="cf-box">' +
        '<div class="cf-msg">' + esc(msg) + '</div>' +
        '<div class="cf-actions">' +
          '<button class="cf-cancel" type="button">取消</button>' +
          '<button class="cf-ok" type="button">删除</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(wrap);
    function done(val){
      if(!pendingConfirm) return;
      pendingConfirm = null;
      if(wrap.parentNode) wrap.parentNode.removeChild(wrap);
      resolve(val);
    }
    wrap.querySelector('.cf-ok').addEventListener('click', function(e){ e.stopPropagation(); done(true); });
    wrap.querySelector('.cf-cancel').addEventListener('click', function(e){ e.stopPropagation(); done(false); });
    wrap.addEventListener('click', function(e){ if(e.target === wrap) done(false); });
  });
}

/* 统一组的数据字段：兼容 {w,r,warm} 与 {weightKg,reps,isWarmup} */
const normSet=s=>({w:+(s.w!==undefined?s.w:s.weightKg)||0, r:+(s.r!==undefined?s.r:s.reps)||0, warm:!!(s.warm||s.isWarmup)});

/* ================= 工具 ================= */
const pad=n=>String(n).padStart(2,'0');
const toKey=d=>{d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const parseKey=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const DAY=86400000;
const shift=(k,n)=>toKey(new Date(parseKey(k).getTime()+n*DAY));
const diffDays=(a,b)=>Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/DAY);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kcal=(met,min,w)=>{const p=store.profile();return Math.round(met*(+w||p.weight||65)*min/60)};
function entryVolume(e){ if(!e||e.type!=='strength')return 0; return (e.exercises||[]).reduce((a,x)=>a+(x.sets||[]).reduce((b,s)=>{const n=normSet(s);return b+(n.warm?0:n.w*n.r)},0),0); }
function entrySets(e){ return (e.exercises||[]).reduce((n,x)=>n+(x.sets||[]).length,0); }
function summarize(s){
  const E=(s&&s.entries)||[]; let min=0,cal=0,vol=0,sets=0;
  E.forEach(e=>{min+=+e.durationMin||0;cal+=+e.calories||0;
    if(e.type==='strength'){vol+=entryVolume(e);sets+=entrySets(e);}});
  return {min,cal,vol:Math.round(vol),sets,n:E.length};
}
function historyMap(map){
  const h={}; Object.keys(map).sort().forEach(d=>{
    (map[d].entries||[]).forEach(e=>{ if(e.type!=='strength')return;
      (e.exercises||[]).forEach(x=>(x.sets||[]).forEach(raw=>{
        const s=normSet(raw); if(s.warm)return; const w=s.w,r=s.r; if(!w&&!r)return;
        const rec=h[x.exId]||(h[x.exId]={lastW:0,lastR:0,lastD:'',best:0,bestW:0,bestR:0,count:0});
        const e1=w*(1+r/30);
        if(e1>rec.best){rec.best=Math.round(e1*10)/10;rec.bestW=w;rec.bestR=r;}
        if(d>=rec.lastD){rec.lastD=d;rec.lastW=w;rec.lastR=r;}
        rec.count++;
      }));});});
  return h;
}
function computeStats(keys,todayKey,goal){
  const set=new Set(keys);
  let c=set.has(todayKey)?todayKey:shift(todayKey,-1),streak=0;
  while(set.has(c)){streak++;c=shift(c,-1);}
  const sorted=[...set].sort(); let longest=0,run=0,prev=null;
  for(const k of sorted){run=prev&&diffDays(prev,k)===1?run+1:1;longest=Math.max(longest,run);prev=k;}
  const off=(parseKey(todayKey).getDay()+6)%7; let wd=0;
  for(let i=0;i<=off;i++) if(set.has(shift(todayKey,-i))) wd++;
  const last7=[]; for(let i=6;i>=0;i--){const k=shift(todayKey,-i);last7.push({k,d:parseKey(k).getDate(),has:set.has(k),today:i===0});}
  return {streak,longest,weekDays:wd,goal,rate:Math.min(1,wd/goal),last7,totalDays:set.size};
}

  const hist=historyMap(store.map());
  state.exs=(exList||[]).map(x=>{

    return {exId:x.exId,name:x.name,sets:(x.sets||[]).map(normSet).length
      ? (x.sets||[]).map(normSet)
      : [{w:h?h.lastW:0,r:h?h.lastR:10,warm:false}]};
  });
  state.minutes=minutes||45; state.note='';
  goTab('strength');
}

    const name=prompt('动作名称（例如：器械推胸 / 单臂绳索下拉）');
    if(!name)return;
    const list=customExercises();
    const id='custom_'+Date.now().toString(36);
    list.push({id,name:name.trim().slice(0,20),muscle:state.libM==='全部'?'全身':state.libM,equipment:'自定义',custom:true});
    saveCustomExercises(list);
    state.exs.push({exId:id,name:name.trim(),sets:[{w:0,r:10,warm:false}]});
    close();
  };
  wrap.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{state.libM=b.dataset.m;render()});

    const id=el.dataset.add; if(state.exs.some(x=>x.exId===id))return toast('已在本次训练中');
    const e=exOf(id); const h=hist[id];
    state.exs.push({exId:id,name:e.name,sets:[{w:h?h.lastW:0,r:h?h.lastR:10,warm:false}]});
    close();
  });
}


/* ================= 统计 ================= */
function renderStats(){
  const map=store.map();
  const keys=Object.keys(map).filter(k=>(map[k].entries||[]).length).sort((a,b)=>a<b?1:-1);
  const st=computeStats(keys,state.today,store.profile().goal);
  const hist=historyMap(map);
  let strengthDays=0,cardioDays=0,totalMin=0,totalVol=0;
  const muscles={};
  keys.forEach(k=>{const E=map[k].entries;
    if(E.some(e=>e.type==='strength'))strengthDays++;
    if(E.some(e=>e.type==='cardio'))cardioDays++;
    E.forEach(e=>{totalMin+=+e.durationMin||0;
      if(e.type==='strength'){totalVol+=entryVolume(e);
        e.exercises.forEach(x=>(muscles[exOf(x.exId).muscle]=(muscles[exOf(x.exId).muscle]||0)+x.sets.filter(s=>!normSet(s).warm).length))}});});
  const mTotal=Object.values(muscles).reduce((a,b)=>a+b,0)||1;
  const prs=Object.entries(hist).sort((a,b)=>b[1].best-a[1].best).slice(0,6);
  if(!keys.length){
    app.innerHTML=`<div class="card big-empty"><div class="ico">📊</div><div class="t">还没有训练数据</div><div class="d">先在「今日」记一条，这里会自动生成统计</div></div>`;
    return;
  }
  app.innerHTML=`
  <div class="card sum"><div><b>${st.streak}</b><span class="sub">当前连续</span></div><div><b>${st.longest}</b><span class="sub">历史最长</span></div></div>
  <div class="card"><div class="row"><div class="title">本周目标</div><div class="sub">${st.weekDays} / ${st.goal} 天</div></div>
    <div style="height:8px;background:#f3f4f6;border-radius:999px;margin-top:12px;overflow:hidden"><div style="height:100%;width:${st.rate*100}%;background:linear-gradient(90deg,#22c55e,#0ea5e9)"></div></div></div>
  <div class="card"><div class="title">累计</div>
    <div class="sum"><div><b>${totalMin}</b><span class="sub">总分钟</span></div><div><b>${Math.round(totalVol)}</b><span class="sub">kg 总容量</span></div>
    <div><b>${cardioDays}</b><span class="sub">有氧天数</span></div><div><b>${strengthDays}</b><span class="sub">无氧天数</span></div></div></div>

  ${Object.keys(muscles).length?`<div class="card"><div class="title" style="margin-bottom:10px">肌群分布（按组数）</div>
    ${Object.entries(muscles).sort((a,b)=>b[1]-a[1]).map(([m,n])=>`<div style="display:flex;align-items:center;gap:8px;margin-top:6px">
      <span class="sub" style="width:40px">${m}</span>
      <div style="flex:1;height:8px;background:#f3f4f6;border-radius:999px;overflow:hidden"><div style="height:100%;width:${n/mTotal*100}%;background:linear-gradient(90deg,#8b5cf6,#6366f1)"></div></div>
      <span class="sub" style="width:40px;text-align:right">${n} 组</span></div>`).join('')}</div>`:''}

  ${prs.length?`<div class="card"><div class="title" style="margin-bottom:6px">个人记录（e1RM）</div>
    ${prs.map(([id,h])=>`<div class="row" style="padding:8px 0;border-bottom:1px solid #f3f4f6">
      <div><b style="font-size:14px">${exOf(id).name}</b><div class="sub">${h.bestW}kg × ${h.bestR} · 共练 ${h.count} 组</div></div>
      <div style="font-weight:700;color:#8b5cf6">${h.best}<span class="sub"> kg</span></div></div>`).join('')}</div>`:''}

  <div class="card"><div class="title" style="margin-bottom:8px">训练记录</div>
    ${keys.slice(0,20).map(k=>{const E=map[k].entries,sum=summarize(map[k]);
      return `<div style="padding:10px 0;border-bottom:1px solid #f3f4f6">
        <div class="row"><b style="font-size:14px">${k}</b><span class="sub">${sum.min} 分钟 · ${sum.cal} kcal</span></div>
        ${E.map(e=>e.type==='cardio'?`<div class="sub" style="margin-top:4px">${spOf(e.sport).icon} ${spOf(e.sport).name} · ${e.durationMin}分钟</div>`
        :`<div class="sub" style="margin-top:4px">🏋️ ${e.exercises.map(x=>x.name).slice(0,3).join('、')}${e.exercises.length>3?' 等':''} · ${entrySets(e)}组 · ${Math.round(entryVolume(e))}kg</div>`).join('')}
      </div>`}).join('')}</div>`;
}

/* ================= 日历 ================= */
function renderCal(){
  const y=state.y,m=state.m, month=store.map();
  const first=(new Date(y,m-1,1).getDay()+6)%7, days=new Date(y,m,0).getDate();
  const cells=[];
  for(let i=0;i<first;i++)cells.push(null);
  for(let d=1;d<=days;d++){const k=y+'-'+pad(m)+'-'+pad(d); cells.push({k,d,s:month[k],today:k===state.today,future:k>state.today});}
  let hits=0,c=0,s=0;
  cells.forEach(x=>{if(x&&x.s&&x.s.entries&&x.s.entries.length){hits++;const E=x.s.entries;if(E.some(e=>e.type==='cardio'))c++;if(E.some(e=>e.type==='strength'))s++;}});
  const det=state.detail;
  app.innerHTML=`
  <div class="card">
    <div class="row"><button class="nud" id="prev">‹</button><b style="font-size:16px">${y} 年 ${m} 月</b><button class="nud" id="next">›</button></div>
    <div class="sub" style="text-align:center;margin-top:6px">训练 ${hits} 天 · 有氧 ${c} 天 · 力量 ${s} 天</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--sub);margin-top:12px">${['一','二','三','四','五','六','日'].map(w=>'<div>'+w+'</div>').join('')}</div>
    <div class="calgrid">${cells.map(x=>!x?'<div></div>':`<div class="cell ${(x.s&&x.s.entries&&x.s.entries.length)?'hit':''} ${x.today?'today':''} ${x.future?'future':''}" data-k="${x.k}">${x.d}
      ${(x.s&&x.s.entries&&x.s.entries.length)?`<div class="dots">${x.s.entries.some(e=>e.type==='cardio')?'<span class="d c"></span>':''}${x.s.entries.some(e=>e.type==='strength')?'<span class="d s"></span>':''}</div>`:''}</div>`).join('')}</div>
    <div class="sub" style="text-align:center;margin-top:10px">● 蓝=有氧　● 紫=无氧　点击日期看详情</div>
  </div>
  ${det?`<div class="card"><div class="row"><b>${det.date}</b><span class="sub">${det.sum.min} 分钟 · ${det.sum.cal} kcal</span></div>
    ${det.entries.map(e=>`<div style="padding:10px 0;border-bottom:1px solid #f3f4f6">
      <div class="row"><span>${e.type==='cardio'?spOf(e.sport).icon+' '+spOf(e.sport).name:'🏋️ 力量训练'}</span>
        <b class="kal">${e.type==='cardio'?e.durationMin+' 分钟 · '+e.calories+' kcal':entrySets(e)+' 组 · '+Math.round(entryVolume(e))+' kg'}</b></div>
      ${e.type==='strength'?`<div class="exlines">${e.exercises.map(x=>`<div class="exline"><span>${x.name}</span><span>${x.sets.map(raw=>{const st=normSet(raw);return (st.warm?'(热身)':'')+st.w+'×'+st.r}).join('  ')}</span></div>`).join('')}</div>`:''}
    </div>`).join('')}
    <button class="ghost-btn" id="delDay" style="margin-top:10px;border-color:#fecaca;color:#dc2626">删除这一天</button></div>`:''}`;
  app.querySelector('#prev').onclick=()=>{state.m--;if(state.m<1){state.m=12;state.y--}state.detail=null;render()};
  app.querySelector('#next').onclick=()=>{state.m++;if(state.m>12){state.m=1;state.y++}state.detail=null;render()};
  app.querySelectorAll('[data-k]').forEach(el=>el.onclick=()=>{const s=store.get(el.dataset.k);
    if(!s||!s.entries||!s.entries.length)return toast('这天没有训练');
    state.detail={date:el.dataset.k,entries:s.entries,sum:summarize(s)};render();window.scrollTo(0,99999)});
  if(app.querySelector('#delDay'))app.querySelector('#delDay').addEventListener('click', async function(ev){
    const btn = ev.currentTarget;
    if(btn.dataset.busy === '1') return;
    btn.dataset.busy = '1';
    try {
      const ok = await uiConfirm('删除 ' + det.date + ' 的全部记录？不可恢复。');
      if(!ok) return;
      store.del(det.date); state.detail = null; toast('已删除'); render();
    } finally { delete btn.dataset.busy; }
  });
}

  <div class="card"><div class="row"><div class="title">设置</div><span class="pill">纯本地存储</span></div>
    <div class="setrow2"><span>每周目标天数</span>
      <span>${[2,3,4,5,6,7].map(v=>`<button class="seg ${p.goal===v?'on':''}" data-goal="${v}" style="padding:5px 8px;min-width:30px">${v}</button>`).join('')}</span></div>
    <div class="setrow2"><span>体重（算卡路里）</span><div style="display:flex;align-items:center;gap:6px"><input type="number" id="weight" value="${p.weight}"/><span class="sub">kg</span></div></div>
  </div>

  <div class="card"><div class="title">训练模板 <span class="pill">${tpls.length} 套</span></div>
    ${tpls.length?tpls.map((tp,i)=>`<div class="row" style="padding:10px 0;border-bottom:1px solid #f3f4f6">
      <div><b style="font-size:14px">${esc(tp.name)}</b><div class="sub">${tp.exercises.map(x=>exOf(x.exId).name).join('、')}</div></div>
      <button class="tpl-del" data-tpldel="${i}">删除</button></div>`).join(''):'<div class="sub" style="padding:12px 0">还没有模板。练完后在「记无氧」页底部点「存成模板」。</div>'}
  </div>

  <div class="card"><div class="title">数据</div>
    <div class="sub" style="margin-top:6px">全部数据保存在这台设备（共 ${days} 天记录）。换设备或清浏览器缓存前，请先导出备份。</div>
    <button class="ok-btn" id="export">⬇️ 导出备份（JSON 文件）</button>
    <button class="ok-btn" id="import" style="background:#f3f4f6;color:#374151">⬆️ 从备份文件导入</button>
    <input type="file" id="file" accept="application/json,.json" style="display:none"/>
    <button class="danger-btn" id="clear">清空所有数据</button>
  </div>
  <div class="sub" style="text-align:center;font-size:11px">v0.3.0 · 网页版 · 卡路里为估算值，仅供参考</div>`;
  app.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{const q=store.profile();q.goal=+b.dataset.goal;store.saveProfile(q);render()});
  app.querySelector('#weight').onchange=e=>{const q=store.profile();q.weight=Math.max(20,Math.min(300,+e.target.value||65));store.saveProfile(q);render()};
  app.querySelectorAll('[data-tpldel]').forEach(b=>b.onclick=()=>{const list=store.templates();list.splice(+b.dataset.tpldel,1);store.saveTemplates(list);render()});
  app.querySelector('#export').onclick=()=>{
    const data={version:2,exportedAt:new Date().toISOString(),sessions:store.map(),templates:store.templates(),profile:store.profile(),customExercises:customExercises()};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='健身记录备份-'+toKey()+'.json';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    toast('已导出备份文件');
  };
  const fileEl=app.querySelector('#file');
  app.querySelector('#import').onclick=()=>fileEl.click();
  fileEl.onchange=()=>{
    const f=fileEl.files[0]; if(!f)return;
    const rd=new FileReader();
    rd.onload=async ()=>{
      try{
        const d=JSON.parse(rd.result);
        const sessions=d.sessions||d;
        if(typeof sessions!=='object')throw new Error('格式不对');
        if(!await uiConfirm('导入会与现有数据合并（同一天以备份为准），继续？'))return;
        const cur=store.map();
        Object.assign(cur,sessions);
        store.save(cur);
        if(d.templates)store.saveTemplates(d.templates);
        if(d.profile)store.saveProfile(d.profile);
        if(d.customExercises)saveCustomExercises(d.customExercises);
        toast('导入完成');render();
      }catch(e){toast('文件无法解析：'+e.message)}
    };
    rd.readAsText(f);
  };
  app.querySelector('#clear').addEventListener('click', async function(ev){
    const btn = ev.currentTarget;
    if(btn.dataset.busy === '1') return;
    btn.dataset.busy = '1';
    try {
      if(!await uiConfirm('确定清空所有训练记录？此操作不可恢复，建议先导出备份。')) return;
      if(!await uiConfirm('再确认一次：真的要清空吗？')) return;
      Object.keys(localStorage).filter(k=>k.indexOf('fitness_')===0).forEach(k=>localStorage.removeItem(k));
      state.exs=[]; state.detail=null; state.kcalInput=''; state.editing=null;
      document.body.classList.remove('has-bar');
      toast('已清空'); render();
    } finally { delete btn.dataset.busy; }
  });
}

/* ================= 底部导航 ================= */
document.getElementById('tabs').addEventListener('click', async function(e){
  const b = e.target.closest('button'); if(!b) return;
  const t = b.dataset.tab;
  if((state.tab==='cardio'||state.tab==='strength') && t!=='home'){
    const dirty = (state.tab==='strength' && state.exs.length>0) || (state.tab==='cardio' && state.kcalInput);
    if(dirty && !await uiConfirm('当前录入还没保存，确定离开？')) return;
    state.editing = null;
  }
  goTab(t);
});

render();
window.addEventListener('error',function(ev){var el=document.createElement('div');el.style.cssText='position:fixed;bottom:60px;left:8px;right:8px;background:#fee2e2;color:#991b1b;font-size:11px;padding:8px;border-radius:8px;z-index:99';el.textContent='脚本错误：'+ev.message+' @'+ev.lineno;document.body.appendChild(el);});
</script>
</body>
</html>
