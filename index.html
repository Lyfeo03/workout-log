<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ec4899" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="运動打卡" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>运動打卡 · 有氧 / 無氧</title>
<style>
  :root{
    --primary:#FFC0CB;        /* PINK */
    --primary-dark:#F2A0B5;   /* 深一級，用於按下態 */
    --accent:#EA8FA6;         /* 文字/強調，深粉，保證對比度 */
    --text:#3D2B31;
    --sub:#9A858E;
    --line:#F7E4EA;
    --bg:#FFF7F9;
    --purple:#B0607F;         /* ORCHID PINK，無氧強調 */
    --purple-text:#C46A85;
    --blue:#FFD1DC;           /* PASTEL PINK */
    --rose-soft:#FFF0F4;
    --light-pink:#F5DADF;
    --baby-pink:#F4C2C2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%;height:100%}
  input,button,textarea{width:100%;height:44px;resize:none;background:#FFF7F9;border:1px solid transparent;border-radius:10px;padding:9px 11px;font-size:14px;font-family:inherit;outline:none}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","PingFang HK","Microsoft JhengHei","Noto Sans TC","Helvetica Neue",sans-serif}
  .app{width:100%;max-width:100%;margin:0 auto;padding:10px 10px calc(78px + env(safe-area-inset-bottom));min-height:100vh;overflow-x:hidden}
  @media (min-width:560px){ .app{max-width:480px} }
  .card{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:9px;box-shadow:0 1px 6px rgba(17,24,39,.04)}
  .row{display:flex;align-items:center;justify-content:space-between}
  .title{font-size:15px;font-weight:600}
  .sub{font-size:12px;color:var(--sub)}
  .hero{color:#5C3A45;background:linear-gradient(135deg,#FFE3EA 0%,#FFC0CB 55%,#F2BDCD 100%);border-radius:18px;padding:14px 16px;margin-bottom:10px}
  .hero h1{margin:2px 0 0;font-size:19px;line-height:1.3}
  .badge{background:rgba(255,255,255,.85);color:#8A4A5D;border-radius:999px;padding:4px 11px;font-size:14px}
  .bar{height:5px;background:rgba(255,255,255,.7);border-radius:999px;overflow:hidden;margin-top:8px}
  .bar>i{display:block;height:100%;background:#EA8FA6;border-radius:999px;transition:width .3s}
  .week{display:flex;justify-content:space-between;gap:2px;margin-top:8px}
  .wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
  .dot{width:11px;height:11px;border-radius:4px;background:rgba(255,255,255,.55)}
  .dot.on{background:#E0708F}
  .dot.today{outline:2px solid rgba(255,255,255,.6)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{flex:0 0 auto;width:auto;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:12px;cursor:pointer;color:#3F3238;white-space:nowrap}
  .chip.active{font-weight:600}
  .dur{display:flex;align-items:center;gap:10px;margin-top:10px}
  .step{width:38px;height:38px;border-radius:50%;border:none;background:#FFF0F4;font-size:15px;font-weight:700;cursor:pointer;color:#3F3238;flex:none;display:flex;align-items:center;justify-content:center;-webkit-user-select:none;touch-action:manipulation}
  .step:active{background:#F7E4EA;transform:scale(.95)}
  .dur input{flex:1;text-align:center;font-size:34px;font-weight:700;border:none;border-bottom:2px solid var(--line);background:transparent;outline:none;color:var(--text)}
  .segs{display:flex;gap:6px;margin-top:6px}
  .seg{flex:1;text-align:center;padding:7px 0;border-radius:9px;background:#FFF0F4;font-size:13px;cursor:pointer;border:none;min-width:0}
  .seg.on{background:#FFF0F4;color:#A8506A;font-weight:600}
  input.txt,textarea{width:100%;background:#FFF7F9;border:1px solid transparent;border-radius:11px;padding:11px;font-size:16px;font-family:inherit;outline:none}
  input.txt:focus,textarea:focus{border-color:var(--primary)}
  textarea{height:64px;resize:none}
  .btn{width:100%;border:none;border-radius:999px;background:var(--primary);color:#7A3B4F;font-size:18px;font-weight:600;padding:14px;cursor:pointer}
  .tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;width:100%;max-width:100%;margin:0 auto;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
  @media (min-width:560px){ .tabs{max-width:480px} }
  .tabs button{flex:1;border:none;background:none;padding:6px 0 7px;font-size:11px;color:var(--sub);cursor:pointer;min-height:46px}
  .tabs button span{display:block;font-size:17px;line-height:1.2}
  .tabs button.on{color:var(--primary-dark);font-weight:600}
  .sum{display:flex;margin-top:8px}
  .sum>div{flex:1;text-align:center}
  .sum b{display:block;font-size:22px}
  .who{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #FFF0F4;cursor:pointer}
  .who:last-child{border-bottom:none}
  .wicon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
  .kind{font-size:10px;border-radius:5px;padding:1px 6px;margin-left:6px;font-weight:400}
  .kind.cardio{background:#FFF0F4;color:#A8506A}
  .kind.strength{background:#F2BDCD;color:#A8506A}
  .addrow{display:flex;gap:9px;margin-top:10px}
  .addcard{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border:none;background:#fff;border-radius:14px;padding:10px 6px;cursor:pointer;box-shadow:0 1px 6px rgba(17,24,39,.04);min-height:64px}
  .addcard.c{border-top:5px solid var(--primary)}
  .addcard.s{border-top:5px solid var(--purple)}
  .excard{background:#fff;border-radius:14px;padding:11px 12px;margin-bottom:9px;box-shadow:0 1px 6px rgba(17,24,39,.04)}
  .setrow{display:flex;align-items:center;gap:2px;padding:5px 0;border-bottom:1px solid #FFF7F9}
  .setrow.warm{background:#FFF7ED;border-radius:8px;padding-left:4px;padding-right:4px}
  .nud{width:30px;height:30px;border-radius:50%;background:#FFF0F4;border:none;font-size:15px;font-weight:600;cursor:pointer;color:#3f3238;flex:none;display:flex;align-items:center;justify-content:center;-webkit-user-select:none;touch-action:manipulation}
  .nud:active{background:#E3C6D0}
  .nin{width:48px;height:30px;text-align:center;border:none;border-bottom:1.5px solid var(--line);font-size:16px;font-weight:600;outline:none;background:transparent;-moz-appearance:textfield}
  .nin::-webkit-outer-spin-button,.nin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .setidx{width:34px;font-size:14px;color:#8a7d87;text-align:center;cursor:pointer}
  .addset{text-align:center;margin-top:6px;padding:7px;border-radius:9px;background:#FFF0F4;color:#A8506A;font-size:12px;font-weight:600;cursor:pointer}
  .rest{display:flex;align-items:center;justify-content:space-between;background:#1f2937;color:#fff;border-radius:16px;padding:14px 16px;margin-bottom:12px}
  .rest b{font-size:28px;display:block;line-height:1}
  .rbtn{background:var(--primary);color:#fff;border-radius:999px;padding:7px 14px;font-size:15px;border:none;cursor:pointer}
  .rbtn.gh{background:rgba(255,255,255,.15)}
  .mask{position:fixed;inset:0;background:rgba(17,24,39,.4);z-index:10}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;height:75vh;background:#fff;border-radius:22px 22px 0 0;z-index:11;display:flex;flex-direction:column;padding:16px}
  .liblist{flex:1;overflow:auto;margin-top:10px}
  .libitem{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #FFF0F4;cursor:pointer}
  .kal{font-weight:700;color:var(--primary-dark);font-size:15px}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:rgba(17,24,39,.88);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
  .cell{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;cursor:pointer;color:#3f3238}
  .cell.hit{background:#FFF0F4;color:#C46A85;font-weight:600}
  .cell.today{box-shadow:inset 0 0 0 2px var(--primary)}
  .cell.future{color:#E3C6D0;cursor:default}
  .dots{display:flex;gap:3px;margin-top:2px}
  .d{width:5px;height:5px;border-radius:50%}
  .d.c{background:#F08BA8} .d.s{background:#9B4A6B}
  .exlines{padding-left:0;margin-top:8px}
  .exline{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:#8a7d87;padding:3px 0}

  /* ---------- 訓練組合 ---------- */
  .tpl-card{background:#fff;border-radius:12px;padding:8px 12px;margin-bottom:7px;box-shadow:0 1px 6px rgba(17,24,39,.04);display:flex;align-items:center;gap:10px}
  .tpl-ico{width:30px;height:30px;border-radius:9px;background:#FFF0F4;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
  .tpl-name{font-weight:600;font-size:14px}
  .tpl-use{border:none;border-radius:999px;background:var(--primary);color:#7A3B4F;font-size:13px;font-weight:600;padding:6px 14px;cursor:pointer;flex:none}
  .tpl-use:active{opacity:.8}
  .tpl-del{border:none;background:none;color:#E3C6D0;font-size:18px;cursor:pointer;padding:4px 6px}
  .ghost-btn{width:100%;border:2px dashed #E3C6D0;background:none;border-radius:16px;padding:13px;color:#8a7d87;font-size:16px;cursor:pointer;margin-bottom:10px}
  .save-tpl{width:100%;border:none;border-radius:14px;background:#FFF0F4;color:#C46A85;font-size:16px;font-weight:600;padding:12px;cursor:pointer;margin-top:10px}

  /* ---------- 設定頁 ---------- */
  .setrow2{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:13px 0;border-bottom:1px solid #FFF0F4}
  .setrow2 > span:last-child{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px}
  .setrow2:last-child{border-bottom:none}
  .setrow2 input[type=number]{width:72px;text-align:right;border:none;border-bottom:1.5px solid var(--line);font-size:17px;outline:none;background:transparent}
  .danger-btn{width:100%;border:1px solid #fecaca;background:#fef2f2;color:#dc2626;border-radius:14px;padding:12px;font-size:16px;cursor:pointer;margin-top:12px}
  .ok-btn{width:100%;border:none;background:var(--primary);color:#7A3B4F;border-radius:14px;padding:12px;font-size:16px;font-weight:600;cursor:pointer;margin-top:12px}
  .pill{display:inline-block;font-size:13px;background:#FFF0F4;color:#8a7d87;border-radius:999px;padding:2px 9px;margin-left:6px}

  /* ---------- 空態 ---------- */
  .big-empty{text-align:center;padding:26px 10px}
  .big-empty .ico{font-size:40px}
  .big-empty .t{font-size:17px;font-weight:600;margin-top:8px}
  .big-empty .d{font-size:14px;color:var(--sub);margin-top:4px}

  /* ---------- 固定底部操作條 ---------- */
  .actionbar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:rgba(255,255,255,.97);backdrop-filter:blur(8px);
    border-top:1px solid var(--line);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    display:flex;gap:10px;max-width:100%;margin:0 auto;
  }
  @media (min-width:560px){ .actionbar{max-width:480px} }
  .actionbar .ab-main{
    flex:1;border:none;border-radius:14px;background:var(--primary);color:#fff;
    font-size:18px;font-weight:700;padding:14px;cursor:pointer;min-height:50px;
  }
  .actionbar .ab-main:active{background:var(--primary-dark)}
  .actionbar .ab-del{
    width:56px;border-radius:14px;border:1px solid #fecaca;background:#fef2f2;color:#dc2626;
    font-size:20px;cursor:pointer;min-height:50px;display:flex;align-items:center;justify-content:center;
  }
  .actionbar .ab-del:active{background:#fee2e2}
  
  /* 儲存成功態 */
  .saved-flash{animation:flash .9s ease}
  @keyframes flash{0%{transform:scale(1)}30%{transform:scale(1.03)}100%{transform:scale(1)}}
  .toast{bottom:calc(150px + env(safe-area-inset-bottom)) !important;font-size:16px !important;padding:12px 20px !important}
  /* 首頁卡片更緊湊 */
  @media (max-width:430px){
    .hero h1{font-size:22px !important}
    .hero{padding:18px !important}
    .addrow{gap:10px !important}
    .addcard{padding:14px !important}
    .card{padding:15px !important;border-radius:18px !important}
  }

  /* ---------- 首頁 v2 ---------- */
  .hero{padding:18px 18px 16px}
  .hero-date{font-size:12px;color:#8A606C}
  .hero h1{margin:5px 0 0;font-size:22px;line-height:1.25;color:#4A2C36}
  .badge{font-size:15px;padding:5px 12px;white-space:nowrap}
  .hero-week{font-size:11px;color:#8A606C;margin-top:4px}
  .week{margin-top:10px}
  .wd{gap:3px;font-size:10px}
  .dot{width:15px;height:15px;border-radius:5px}
  .sec-title{font-size:14px;font-weight:600}
  .sum>div b{font-size:19px;font-weight:700;display:block;line-height:1.2}
  .addrow{gap:10px;margin-top:2px}
  .addcard{display:flex;flex-direction:column;align-items:flex-start;border:none;text-align:left;
    background:#fff;border-radius:18px;padding:14px;cursor:pointer;box-shadow:0 2px 10px rgba(17,24,39,.05);min-height:96px}
  .addcard:active{transform:scale(.98)}
  .addcard.c{border-top:4px solid var(--primary)}
  .addcard.s{border-top:4px solid var(--purple)}
  .ac-ico{font-size:20px;line-height:1}
  .addcard b{font-size:14px;margin-top:3px}
  .addcard small{font-size:10px;color:var(--sub);margin-top:1px}

  /* 首頁記錄行 */
  .rec-row{display:flex;align-items:center;gap:6px;border-bottom:1px solid #FFF0F4;padding:4px 0}
  .rec-row:last-child{border-bottom:none}
  .rec-main{display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:6px 2px;cursor:pointer;border-radius:10px}
  .rec-main:active{background:#FFF7F9}
  .rec-main.rec-col{flex-direction:column;align-items:stretch;gap:0}
  .rec-col > .row{width:100%}
  .rec-info{flex:1;min-width:0;padding-left:2px}
  .rec-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:5px;line-height:1.35}
  .rec-main{gap:14px}
  .rec-val{font-weight:700;color:#C2607C;font-size:14px;white-space:nowrap}
  .rec-unit{font-size:13px;font-weight:400;color:var(--sub)}
  .rec-del{border:1px solid #fee2e2;background:#fef2f2;color:#ef4444;width:30px;height:30px;border-radius:9px;font-size:14px;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}
  .rec-del:active{background:#fee2e2;color:#dc2626}
  .exlines{padding-left:0;margin-top:6px}
  .exline{font-size:14px;padding:3px 0}
  .ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tpl-block{margin-top:2px}
  .foot-note{text-align:center;font-size:13px;color:var(--sub);margin-top:16px;line-height:1.6}

  /* 錄入頁：隱藏底部導航，避免與儲存條重叠 */
  body.has-bar #tabs{display:none !important}
  
  /* 時長行：確保 +5 不被擠出屏幕 */
  .dur{display:flex;align-items:center;gap:8px;margin-top:10px}
  .dur > div{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:center;gap:5px}
  .dur input{width:80px !important;max-width:80px}
  /* 分段按钮在窄屏下也放得下 */
  .segs{gap:8px}
  .seg{font-size:15px;padding:10px 0;min-width:0}
  /* 运動類型胶囊允许換行且不溢出 */
  .chips{gap:8px}
  .chip{font-size:15px;padding:7px 12px;white-space:nowrap}

  body.has-bar .app{padding-bottom:calc(110px + env(safe-area-inset-bottom)) !important}

  .hero{overflow:hidden}
  .week{display:flex;justify-content:space-between;gap:2px}
  .wd{flex:1;min-width:0}
  .sum>div{min-width:0}
  .sum>div b{display:block}
  .sum>div .sub{display:block;font-size:13px;white-space:nowrap}
  .card{overflow:hidden}
  .rec-title{min-width:0}
  .rec-main{min-width:0}

  .wd span{font-size:9px;color:#9A7783}
  .dot{width:14px;height:14px}
  .week{gap:0}
  .hero .row{gap:8px}

  /* ---------- 無氧 v2 ---------- */
  .ex-head{font-weight:700;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hist-line{font-size:11px;color:#A8506A;background:#FFF0F4;border-radius:6px;padding:4px 8px;margin-top:6px}
  .setrow{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid #FFF7F9}
  .setrow:last-of-type{border-bottom:none}
  .setrow.warm{background:#fffbeb;border-radius:10px;padding-left:6px;padding-right:6px}
  .wt-group{display:flex;align-items:center;gap:3px;flex:1;min-width:0;justify-content:center}
  .times-sign{font-size:13px;color:#9A858E;font-weight:600;flex:none;padding:0}
  .unit{font-size:11px;color:#9A858E;flex:none;width:14px;text-align:left}
  .row-x{width:22px;text-align:center;color:#D8C4CC;font-size:14px;cursor:pointer;flex:none;padding:4px 0}
  .row-x:active{color:#ef4444}
  .add-ex-btn{width:100%;border:2px dashed #F2BDCD;background:none;border-radius:12px;padding:11px;color:#C2607C;font-size:14px;cursor:pointer;margin-bottom:9px}
  .add-ex-btn:active{background:#FFF7F9}
  .addset{margin-top:10px}
  .excard{padding:16px}

  .exlines .exline{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  .exline-n{color:#8a7d87;flex:none}
  .exline-v{color:#3f3238;font-variant-numeric:tabular-nums;text-align:right}

  .setrow{gap:2px}
  .nud{width:34px;height:34px;font-size:18px}
  .nin{width:56px;height:34px;font-size:18px}

  /* ---------- 頁內確認條 ---------- */
  .cf-mask{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:999;
    display:flex;align-items:flex-end;justify-content:center;padding:0 0 env(safe-area-inset-bottom)}
  .cf-box{position:relative;z-index:1000;width:100%;max-width:480px;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(17,24,39,.18);
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));animation:cfUp .18s ease}
  @keyframes cfUp{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
  .cf-msg{font-size:18px;line-height:1.5;text-align:center;color:#1f1a1e;padding:6px 0 18px}
  .cf-actions{display:flex;gap:12px}
  .cf-actions button{flex:1;border:none;border-radius:14px;padding:15px;font-size:18px;
    font-weight:600;cursor:pointer;min-height:50px;touch-action:manipulation}
  .cf-cancel{background:#FFF0F4;color:#3f3238}
  .cf-cancel:active{background:#F9DDE5}
  .cf-ok{background:#ef4444;color:#fff}
  .cf-ok:active{background:#dc2626}

  /* ---------- 返回按钮 ---------- */
  .back-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:4px;
    min-width:88px;height:40px;padding:0 16px;
    border:none;border-radius:999px;background:#FFF0F4;color:#6b5561;
    font-size:17px;font-weight:500;cursor:pointer;flex:none;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  }
  .back-btn:active{background:#F9DDE5;color:#1f1a1e}

  .rec-val, .kal, .entry-metric{color:#C2607C !important}
  .sum-v, .sum>div b{color:var(--text)}
  .pr-val{color:#C46A85 !important}
  .hist-line{color:#A8506A !important}
  .addset{background:#FFF0F4;color:#A8506A}
  .save-tpl{background:#FFF0F4;color:#A8506A}
  .tpl-card, .card{background:#fff}

  /* ---------- 无氧记录卡片 v2 ---------- */

<body>
<div id="storageWarn" style="display:none;position:fixed;top:0;left:0;right:0;z-index:100;background:#fef3c7;color:#92400e;font-size:12px;padding:8px 12px;text-align:center;border-bottom:1px solid #fde68a">
  ⚠️ 目前環境無法儲存資料（localStorage 被禁用），重新整理後記錄會丟失
</div>
<div class="app" id="app"></div>
<nav class="tabs" id="tabs">
  <button data-tab="home" class="on"><span>💪</span>今日</button>
  <button data-tab="stats"><span>📊</span>統計</button>

<div class="toast" id="toast"></div>

<script>

/* ================= 儲存可用性檢測 =================
   某些環境（沙箱 iframe / 內嵌 WebView）會禁用 localStorage，
   這裡做內存兜底，頁面照常可用，同時顶部给出警告。 */
const memStore = {};
let LS_OK = true;
try {
  localStorage.setItem('__t', '1'); localStorage.removeItem('__t');
} catch (e) { LS_OK = false; }
if (!LS_OK) {
  const raw = {
    getItem(k){ return Object.prototype.hasOwnProperty.call(memStore, k) ? memStore[k] : null; },
    setItem(k, v){ memStore[k] = String(v); },
    removeItem(k){ delete memStore[k]; },
    clear(){ Object.keys(memStore).forEach(k => delete memStore[k]); }
  };
  try { Object.defineProperty(window, 'localStorage', { value: raw, configurable: true }); } catch (e) {}
  document.addEventListener('DOMContentLoaded', () => {
    const w = document.getElementById('storageWarn');
    if (w) w.style.display = 'block';
  });
}

/* ================= 頁面內確認條（替代 window.confirm） =================
   原生 confirm 在快速連點時會出現多個系計弹窗叠层，误触容易“像關掉網頁”。
   這裡改為頁內確認條：不阻塞、只允许一個、點後立即刪除。 */
/* 計一的刪除按钮绑定：防連點、頁內確認、刪除後回首頁 */
function bindDelete(btn, opts){
  if(!btn) return;
  btn.addEventListener('click', async function(ev){
    ev.preventDefault();
    ev.stopPropagation();
    if(btn.dataset.busy === '1') return;
    const id = opts.editing();
    if(!id){ toast('還沒儲存過，無需刪除'); return; }
    btn.dataset.busy = '1';
    try {
      const ok = await uiConfirm(opts.confirmText || '確定刪除？');
      if(!ok) return;
      opts.onDelete(id);
      state.editing = null;
      if(state.tab === 'strength') state.exs = [];
      document.body.classList.remove('has-bar');
      toast('已刪除');
      goTab('home');
    } finally { delete btn.dataset.busy; }
  });
}

let pendingConfirm = null;   // {resolve}
function uiConfirm(msg){
  if(pendingConfirm) return Promise.resolve(false);   // 已有確認條在等，忽略新的
  return new Promise(function(resolve){
    pendingConfirm = { resolve };
    var wrap = document.createElement('div');
    wrap.className = 'cf-mask';
    wrap.innerHTML =
      '<div class="cf-box">' +
        '<div class="cf-msg">' + esc(msg) + '</div>' +
        '<div class="cf-actions">' +
          '<button class="cf-cancel" type="button">取消</button>' +
          '<button class="cf-ok" type="button">刪除</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(wrap);
    function done(val){
      if(!pendingConfirm) return;
      pendingConfirm = null;
      if(wrap.parentNode) wrap.parentNode.removeChild(wrap);
      resolve(val);
    }
    wrap.querySelector('.cf-ok').addEventListener('click', function(e){ e.stopPropagation(); done(true); });
    wrap.querySelector('.cf-cancel').addEventListener('click', function(e){ e.stopPropagation(); done(false); });
    wrap.addEventListener('click', function(e){ if(e.target === wrap) done(false); });
  });
}

/* ================= 資料层 =================
   全部資料都在本機浏覽器 localStorage，換機/清快取前請到「我的 → 匯出 JSON」備份。 */
const KEY='fitness_sessions_v2';
const TPL_KEY='fitness_templates_v1';
const PROF_KEY='fitness_profile_v1';

const store={
  map(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } },
  save(m){ localStorage.setItem(KEY, JSON.stringify(m)); },
  get(d){ return this.map()[d]||null; },
  put(s){ const m=this.map(); m[s.date]=s; this.save(m); },
  del(d){ const m=this.map(); delete m[d]; this.save(m); },
  templates(){ try{ return JSON.parse(localStorage.getItem(TPL_KEY))||[]; }catch(e){ return []; } },
  saveTemplates(list){ localStorage.setItem(TPL_KEY, JSON.stringify(list)); },
  profile(){ try{ return Object.assign({goal:3,weight:65,unit:'kg'}, JSON.parse(localStorage.getItem(PROF_KEY))||{}); }catch(e){ return {goal:3,weight:65,unit:'kg'}; } },
  saveProfile(p){ localStorage.setItem(PROF_KEY, JSON.stringify(p)); },
  prs(){ try{ return JSON.parse(localStorage.getItem('fitness_prs_v1'))||[]; }catch(e){ return []; } },
  savePrs(list){ localStorage.setItem('fitness_prs_v1', JSON.stringify(list)); }
,
  cheats(){ try{ return JSON.parse(localStorage.getItem('fitness_cheats_v1'))||[]; }catch(e){ return []; } },
  saveCheats(list){ localStorage.setItem('fitness_cheats_v1', JSON.stringify(list)); }};

/* ================= 常量 ================= */
const SPORTS=[
  {key:'running',name:'跑步',icon:'🏃',met:9.8,distance:true,color:'#F2A0B5'},
  {key:'treadmill_incline',name:'跑步機爬坡',icon:'⛰️',met:8.8,distance:true,color:'#E8A0B8'},
  {key:'walking',name:'快走',icon:'🚶',met:4,distance:true,color:'#F4C2C2'},
  {key:'cycling',name:'骑行',icon:'🚴',met:7.5,distance:true,color:'#E3A6C4'},
  {key:'swimming',name:'游泳',icon:'🏊',met:8,distance:true,color:'#EFB4B4'},
  {key:'elliptical',name:'椭圓機',icon:'🌀',met:5,distance:false,color:'#F7C9D8'},
  {key:'rowing',name:'劃船機',icon:'🚣',met:7,distance:true,color:'#E8B4CB'},
  {key:'jump_rope',name:'跳绳',icon:'🪢',met:11,distance:false,color:'#F5C2CC'},
  {key:'stairs',name:'爬樓',icon:'🪜',met:8.8,distance:false,color:'#EAAFBF'},
  {key:'hiking',name:'爬山',icon:'🥾',met:7.3,distance:true,color:'#F0B8C8'},

];
const EXERCISES=[
  ['bench_press','杠铃卧推','胸','杠铃'],['incline_bench','上斜卧推','胸','杠铃'],['db_press','啞铃卧推','胸','啞铃'],
  ['db_incline','上斜啞铃卧推','胸','啞铃'],['chest_fly','龍门夹胸','胸','绳索'],['pec_deck','蝴蝶機夹胸','胸','器械'],
  ['pushup','俯卧撐','胸','自重'],['dip','雙杠臂屈伸','胸','自重'],
  ['pullup','引體向上','背','自重'],['lat_pulldown','高位下拉','背','器械'],['barbell_row','杠铃劃船','背','杠铃'],
  ['db_row','单臂啞铃劃船','背','啞铃'],['seated_row','坐姿劃船','背','器械'],['cable_row','绳索劃船','背','绳索'],
  ['deadlift','硬拉','背','杠铃'],['face_pull','面拉','背','绳索'],['hyperextension','山羊挺身','背','器械'],
  ['squat','杠铃深蹲','腿臀','杠铃'],['front_squat','前蹲','腿臀','杠铃'],['leg_press','腿舉','腿臀','器械'],
  ['leg_extension','腿屈伸','腿臀','器械'],['leg_curl','腿弯舉','腿臀','器械'],['rdl','羅马尼亞硬拉','腿臀','杠铃'],
  ['hip_thrust','臀推','腿臀','杠铃'],['lunge','箭步蹲','腿臀','啞铃'],['calf_raise','提踵','腿臀','器械'],
  ['goblet_squat','高脚杯深蹲','腿臀','啞铃'],
  ['ohp','杠铃推舉','肩','杠铃'],['db_shoulder_press','啞铃推舉','肩','啞铃'],['lateral_raise','啞铃側平舉','肩','啞铃'],
  ['front_raise','前平舉','肩','啞铃'],['reverse_fly','反向飞鳥','肩','啞铃'],['upright_row','直立劃船','肩','杠铃'],
  ['barbell_curl','杠铃弯舉','手臂','杠铃'],['db_curl','啞铃弯舉','手臂','啞铃'],['hammer_curl','锤式弯舉','手臂','啞铃'],
  ['preacher_curl','牧师凳弯舉','手臂','器械'],['triceps_pushdown','绳索下壓','手臂','绳索'],['skull_crusher','仰卧臂屈伸','手臂','杠铃'],
  ['overhead_ext','啞铃臂屈伸','手臂','啞铃'],
  ['plank','平板支撐','核心','自重'],['crunch','卷腹','核心','自重'],['hanging_leg_raise','懸垂舉腿','核心','自重'],
  ['cable_crunch','绳索卷腹','核心','绳索'],['russian_twist','俄羅斯轉體','核心','啞铃'],
  ['farmer_walk','農夫行走','全身','啞铃'],['kettlebell_swing','壶铃搖擺','全身','壶铃']
].map(a=>({id:a[0],name:a[1],muscle:a[2],equipment:a[3]}));
const MUSCLES=['胸','背','腿臀','肩','手臂','核心','全身'];

/* 自定義動作（存本機） */
const CUSTOM_KEY='fitness_custom_ex_v1';
function customExercises(){ try{ return JSON.parse(localStorage.getItem(CUSTOM_KEY))||[]; }catch(e){ return []; } }
function saveCustomExercises(list){ localStorage.setItem(CUSTOM_KEY, JSON.stringify(list)); }
function allExercises(){ return EXERCISES.concat(customExercises()); }

const exOf=id=>allExercises().find(e=>e.id===id)||{id,name:id,muscle:'全身',equipment:''};
const spOf=k=>SPORTS.find(s=>s.key===k)||SPORTS[0];
/* 計一組的資料字段：兼容 {w,r,warm} 與 {weightKg,reps,isWarmup} */
const normSet=s=>({w:+(s.w!==undefined?s.w:s.weightKg)||0, r:+(s.r!==undefined?s.r:s.reps)||0, warm:!!(s.warm||s.isWarmup)});

/* ================= 工具 ================= */
const pad=n=>String(n).padStart(2,'0');
const toKey=d=>{d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const parseKey=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const DAY=86400000;
const shift=(k,n)=>toKey(new Date(parseKey(k).getTime()+n*DAY));
const diffDays=(a,b)=>Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/DAY);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kcal=(met,min,w)=>{const p=store.profile();return Math.round(met*(+w||p.weight||65)*min/60)};
function entryVolume(e){ if(!e||e.type!=='strength')return 0; return (e.exercises||[]).reduce((a,x)=>a+(x.sets||[]).reduce((b,s)=>{const n=normSet(s);return b+(n.warm?0:n.w*n.r)},0),0); }
function entrySets(e){ return (e.exercises||[]).reduce((n,x)=>n+(x.sets||[]).length,0); }
function summarize(s){
  const E=(s&&s.entries)||[]; let min=0,cal=0,vol=0,sets=0;
  E.forEach(e=>{min+=+e.durationMin||0;cal+=+e.calories||0;
    if(e.type==='strength'){vol+=entryVolume(e);sets+=entrySets(e);}});
  return {min,cal,vol:Math.round(vol),sets,n:E.length};
}
function historyMap(map){
  const h={}; Object.keys(map).sort().forEach(d=>{
    (map[d].entries||[]).forEach(e=>{ if(e.type!=='strength')return;
      (e.exercises||[]).forEach(x=>(x.sets||[]).forEach(raw=>{
        const s=normSet(raw); if(s.warm)return; const w=s.w,r=s.r; if(!w&&!r)return;
        const rec=h[x.exId]||(h[x.exId]={lastW:0,lastR:0,lastD:'',best:0,bestW:0,bestR:0,count:0});
        const e1=w*(1+r/30);
        if(e1>rec.best){rec.best=Math.round(e1*10)/10;rec.bestW=w;rec.bestR=r;}
        if(d>=rec.lastD){rec.lastD=d;rec.lastW=w;rec.lastR=r;}
        rec.count++;
      }));});});
  return h;
}
function computeStats(keys,todayKey,goal){
  const set=new Set(keys);
  let c=set.has(todayKey)?todayKey:shift(todayKey,-1),streak=0;
  while(set.has(c)){streak++;c=shift(c,-1);}
  const sorted=[...set].sort(); let longest=0,run=0,prev=null;
  for(const k of sorted){run=prev&&diffDays(prev,k)===1?run+1:1;longest=Math.max(longest,run);prev=k;}
  const off=(parseKey(todayKey).getDay()+6)%7; let wd=0;
  for(let i=0;i<=off;i++) if(set.has(shift(todayKey,-i))) wd++;
  const last7=[]; for(let i=6;i>=0;i--){const k=shift(todayKey,-i);last7.push({k,d:parseKey(k).getDate(),has:set.has(k),today:i===0});}
  // 本週（週一為第一日）：週一 → 週日 固定 7 格
  const monday=shift(todayKey,-off);
  const week7=[];
  for(let i=0;i<7;i++){const k=shift(monday,i);
    week7.push({k,d:parseKey(k).getDate(),has:set.has(k),today:k===todayKey,future:k>todayKey,wd:['一','二','三','四','五','六','日'][i]});}
  return {streak,longest,weekDays:wd,goal,rate:Math.min(1,wd/goal),last7,week7,totalDays:set.size};
}

/* 用範本/已有記錄開啟一次無氧錄入；範本裡的重量回填「上次訓練」 */
function startStrength(exList, minutes, date){
  if(date) state.editDate=date;
  const hist=historyMap(store.map());
  state.exs=(exList||[]).map(x=>{
    const h=hist[x.exId];
    return {exId:x.exId,name:x.name,sets:(x.sets||[]).map(normSet).length
      ? (x.sets||[]).map(normSet)
      : [{w:h?h.lastW:0,r:h?h.lastR:10,warm:false}]};
  });
  state.minutes=minutes||45; state.note='';
  goTab('strength');
}

/* ================= 放縱餐 =================
   規則：累計打卡每滿 20 天得 1 次放縱餐機會。
   未使用的機會會一直保留（打卡進度照樣累積，不會清零）。
   例：打卡 25 天時才用，仍剩 25-20=5 天進度。 */
const CHEAT_GOAL = 20;
function cheatStats(){
  const map = store.map();
  const allDays = Object.keys(map).filter(k=>((map[k]||{}).entries||[]).length>0);
  const total = allDays.length;                     // 累計打卡天數
  const used = store.cheats();                      // 已使用的放縱餐 [{date, food, usedAt}]
  const earned = Math.floor(total / CHEAT_GOAL);    // 已獲得次數
  const available = Math.max(0, earned - used.length); // 可用次數
  const progress = total % CHEAT_GOAL;              // 目前循環進度
  return { total, earned, used, available, progress, goal: CHEAT_GOAL };
}

      }

      state.detail={date:det.date,entries:(rec2&&rec2.entries)||[],sum:summarize(rec2||{entries:[]})};

      state.exs=[]; state.detail=null; state.kcalInput=''; state.editing=null;
      document.body.classList.remove('has-bar');
      toast('已清除'); render();
    } finally { delete btn.dataset.busy; }
  });
}

/* ================= 底部導航 ================= */
document.getElementById('tabs').addEventListener('click', async function(e){
  const b = e.target.closest('button'); if(!b) return;
  const t = b.dataset.tab;
  if((state.tab==='cardio'||state.tab==='strength') && t!=='home'){
    const dirty = (state.tab==='strength' && state.exs.length>0) || (state.tab==='cardio' && state.kcalInput);
    if(dirty && !await uiConfirm('而家仲未儲存，確定離開？')) return;
    state.editing = null;
  }
  goTab(t);
});

render();
window.addEventListener('error',function(ev){var el=document.createElement('div');el.style.cssText='position:fixed;bottom:60px;left:8px;right:8px;background:#fee2e2;color:#991b1b;font-size:11px;padding:8px;border-radius:8px;z-index:99';el.textContent='脚本誤误：'+ev.message+' @'+ev.lineno;document.body.appendChild(el);});
</script>
</body>
</html>
